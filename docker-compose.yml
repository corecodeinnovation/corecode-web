services:
  web:
    build: .
    container_name: corecode-web
    networks:
      - cci-net
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explícito: busybox wget resuelve localhost como ::1 y Next escucha solo IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  cci-net:
    external: true
