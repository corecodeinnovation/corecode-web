<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 6 140 66" width="350" height="165" role="img" aria-label="Core Code Innovation">
  <title>Core Code Innovation — monograma CCI</title>
  <!-- C1 (Core) -->
  <path d="M46 20 a24 24 0 1 0 0 44" fill="none" stroke="#8A93A0" stroke-width="11" stroke-linecap="round"/>
  <!-- C2 (Code) -->
  <path d="M92 20 a24 24 0 1 0 0 44" fill="none" stroke="#5A6472" stroke-width="11" stroke-linecap="round"/>
  <!-- I (Innovation) = bloques apilados, pegada a la C2 -->
  <rect x="110" y="18" width="15" height="15" rx="3" fill="#FF5A1F"/>
  <rect x="110" y="35" width="15" height="15" rx="3" fill="#FF7A2E"/>
  <rect x="110" y="52" width="15" height="15" rx="3" fill="#8A93A0"/>
  <!-- esquirlas (guiño al cubo fragmentado) -->
  <rect x="129" y="12" width="8" height="8" rx="2" fill="#FF8A3D" transform="rotate(18 133 16)"/>
  <rect x="131" y="26" width="5" height="5" rx="1.5" fill="#FF5A1F" transform="rotate(-12 133 28)"/>
